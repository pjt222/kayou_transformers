[package]
name = "classify"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "classify"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
indicatif = "0.17"
anyhow = "1"

[profile.release]
opt-level = 2
