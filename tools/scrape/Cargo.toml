[package]
name = "scrape"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "scrape"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
anyhow = "1"
scraper = "0.22"
url = "2"
regex = "1"
sha2 = "0.10"
chrono = "0.4"
async-trait = "0.1"

[profile.release]
opt-level = 2
